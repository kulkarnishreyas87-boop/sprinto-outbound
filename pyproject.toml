[project]
name = "sprinto"
version = "0.1.0"
description = "Sprinto outbound research and drafting pipeline (MESA Term 2, Build 2)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anthropic",
    "resend>=2.0",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "google-genai>=3.6.1",
]

[project.optional-dependencies]
render = ["playwright>=1.45"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
sprinto = "sprinto.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
