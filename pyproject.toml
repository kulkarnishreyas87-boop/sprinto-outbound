[project]
name = "sprinto"
version = "0.1.0"
description = "Sprinto outbound research and drafting pipeline (MESA Term 2, Build 2)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anthropic",
    "resend>=2.0",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "google-genai>=3.6.1",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
render = ["playwright>=1.45"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "uvicorn>=0.30",
]

[project.scripts]
sprinto = "sprinto.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Vercel: serve the FastAPI app (see vercel.json for duration and bundle exclusions)
[tool.vercel]
entrypoint = "main:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
