{% extends "base.html" %}
{% block title %}Operator login · Sprinto Outbound{% endblock %}
{% block body %}
<div style="max-width:380px;margin:40px auto 0">
  <h1 style="font-size:1.5rem">Operator login</h1>
  <p class="muted">Running the pipeline and approving drafts spend API credits and send email, so they need the operator password.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="card fade-in">
    <label for="password" style="margin-top:0">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus style="width:100%">
    <button type="submit" style="width:100%;justify-content:center;margin-top:14px">Log in</button>
  </form>
</div>
{% endblock %}
